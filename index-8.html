<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Earn App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Ad network IDs/links are no longer hardcoded here - they are all
     set from admin.html and loaded from Firestore at startup. -->

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Roboto, Arial, sans-serif;
    background: #0f0f14; color: #fff; padding-bottom: 70px;
  }
  .hidden { display: none !important; }
  .card { background: #1a1a22; border-radius: 14px; padding: 14px 16px; }
  .btn {
    width: 100%; border: none; border-radius: 12px; padding: 13px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-primary { background: #6b5ce7; color: #fff; }
  .btn-secondary { background: #24242e; color: #fff; }
  .btn:disabled { opacity: 0.4; }
  input {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid #2c2c38;
    background: #1a1a22; color: #fff; font-size: 14px;
  }
  #topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px; }
  #balanceCard { margin: 0 16px 14px; border-radius: 14px; padding: 16px; background: #6b5ce7; }
  #tasksGrid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; padding: 0 16px 16px; }
  .taskTile { background: #1a1a22; border-radius: 14px; padding: 16px 10px; text-align: center; }
  .taskTile .icon { font-size: 26px; margin-bottom: 6px; }
  #bottomNav {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    background: #15151c; padding: 10px 0; border-top: 1px solid #24242e;
  }
  .navItem { text-align: center; font-size: 10px; color: #777; cursor: pointer; }
  .navItem.active { color: #6b5ce7; }
  .navItem .icon { font-size: 20px; }
  .listRow { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #24242e; }
  #adOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex;
    align-items: center; justify-content: center; z-index: 999;
  }
  #adOverlay .box { background: #1a1a22; border-radius: 16px; padding: 16px; width: 85%; max-width: 300px; text-align: center; }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style id="premium-ui">
  :root{
    --bg:#080910;--surface:#11131d;--surface2:#171a27;--line:rgba(255,255,255,.08);
    --primary:#7c5cff;--primary2:#5b8cff;--text:#f7f7fb;--muted:#8f94a8;
    --green:#36d399;--yellow:#f6c453;--danger:#ff667a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{
    margin:0!important;min-height:100vh;padding-bottom:82px!important;
    font-family:Inter,system-ui,-apple-system,sans-serif!important;
    color:var(--text)!important;background:
      radial-gradient(circle at 15% -10%,rgba(124,92,255,.22),transparent 34%),
      radial-gradient(circle at 100% 20%,rgba(91,140,255,.13),transparent 30%),
      var(--bg)!important;
    overflow-x:hidden;
  }
  body:before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
    background:linear-gradient(120deg,transparent 0%,rgba(255,255,255,.015) 45%,transparent 55%);
    animation:shine 7s linear infinite;
  }
  @keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 0 rgba(124,92,255,0)}50%{box-shadow:0 0 28px rgba(124,92,255,.25)}}
  .card,.taskTile,#balanceCard,#adOverlay .box{
    border:1px solid var(--line)!important;
    box-shadow:0 12px 35px rgba(0,0,0,.22)!important;
    backdrop-filter:blur(12px);
  }
  .card{background:linear-gradient(145deg,rgba(25,28,42,.96),rgba(15,17,27,.96))!important}
  #topbar{
    min-height:58px;padding:14px 16px!important;
    font-family:"Space Grotesk",Inter,sans-serif;font-weight:600;font-size:16px;
  }
  #balanceCard{
    position:relative;overflow:hidden;margin:0 16px 16px!important;padding:20px!important;
    border:0!important;border-radius:20px!important;
    background:linear-gradient(135deg,#7657ff 0%,#5f70ff 48%,#3f9bff 100%)!important;
    animation:pulseGlow 3s ease-in-out infinite;
  }
  #balanceCard:after{
    content:"";position:absolute;width:170px;height:170px;right:-55px;top:-75px;border-radius:50%;
    background:rgba(255,255,255,.12);filter:blur(2px);
  }
  #balanceCard:before{
    content:"";position:absolute;width:90px;height:90px;right:35px;bottom:-50px;border-radius:50%;
    background:rgba(255,255,255,.08);
  }
  #balanceCard > *{position:relative;z-index:1}
  #balanceCard div:nth-child(2){font-family:"Space Grotesk",sans-serif!important;font-size:30px!important;font-weight:700!important;letter-spacing:-.5px}
  #tasksGrid{gap:12px!important;padding:0 16px 18px!important}
  .taskTile{
    position:relative;overflow:hidden;padding:17px 10px!important;min-height:108px;
    background:linear-gradient(145deg,#151824,#10121b)!important;
    transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
    animation:rise .45s ease both;
  }
  .taskTile:nth-child(2){animation-delay:.04s}.taskTile:nth-child(3){animation-delay:.08s}
  .taskTile:nth-child(4){animation-delay:.12s}.taskTile:nth-child(5){animation-delay:.16s}
  .taskTile:nth-child(6){animation-delay:.20s}
  .taskTile:before{
    content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(124,92,255,.10),transparent 55%);
    opacity:0;transition:opacity .2s;
  }
  .taskTile:active{transform:scale(.97)}
  .taskTile:hover{transform:translateY(-2px);border-color:rgba(124,92,255,.4)!important;box-shadow:0 12px 28px rgba(0,0,0,.28)!important}
  .taskTile:hover:before{opacity:1}
  .taskTile .icon{
    display:flex;align-items:center;justify-content:center;width:46px;height:46px;margin:0 auto 9px!important;
    border-radius:14px;font-size:23px!important;
    background:linear-gradient(145deg,rgba(124,92,255,.20),rgba(91,140,255,.10));
    border:1px solid rgba(124,92,255,.18);animation:float 3.5s ease-in-out infinite;
  }
  .taskTile{font-size:12px;font-weight:600}
  .btn{
    position:relative;overflow:hidden;border-radius:14px!important;padding:14px!important;
    font-family:Inter,sans-serif!important;font-weight:700!important;
    transition:transform .18s,filter .18s,box-shadow .18s!important;
  }
  .btn:active{transform:scale(.98)}
  .btn-primary{
    background:linear-gradient(135deg,#7657ff,#5b8cff)!important;
    box-shadow:0 9px 24px rgba(103,85,255,.24)!important;
  }
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-secondary{background:#191c28!important;border:1px solid var(--line)!important}
  input,select{
    background:#11141e!important;border:1px solid var(--line)!important;
    border-radius:13px!important;outline:none;transition:border-color .2s,box-shadow .2s;
  }
  input:focus,select:focus{border-color:rgba(124,92,255,.65)!important;box-shadow:0 0 0 3px rgba(124,92,255,.10)}
  #bottomNav{
    left:10px!important;right:10px!important;bottom:10px!important;
    border:1px solid var(--line)!important;border-radius:20px!important;
    background:rgba(15,17,27,.88)!important;backdrop-filter:blur(18px);
    box-shadow:0 15px 40px rgba(0,0,0,.42)!important;padding:8px 4px!important;
  }
  .navItem{
    min-width:70px;padding:5px 8px!important;border-radius:14px;
    color:#777d91!important;font-weight:600;transition:.2s;
  }
  .navItem.active{color:#fff!important;background:rgba(124,92,255,.14)}
  .navItem .icon{font-size:19px!important;margin-bottom:2px}
  .navItem.active .icon{filter:drop-shadow(0 0 8px rgba(124,92,255,.6))}
  .listRow{border-bottom:1px solid var(--line)!important;padding:13px 0!important}
  #adOverlay{background:rgba(2,3,8,.78)!important;backdrop-filter:blur(8px)}
  #adOverlay .box{background:#121521!important}
  #app{animation:rise .35s ease}
  p{line-height:1.5}
  ::selection{background:rgba(124,92,255,.35)}
</style>


<style id="ios-premium-theme">
  :root{
    --ios-bg:#f2f2f7;--ios-card:rgba(255,255,255,.78);--ios-solid:#fff;
    --ios-text:#111116;--ios-muted:#777782;--ios-line:rgba(60,60,67,.14);
    --ios-blue:#007aff;--ios-purple:#5856d6;--ios-green:#34c759;--ios-red:#ff3b30;
    --ios-shadow:0 10px 35px rgba(0,0,0,.08);
  }
  body{
    color:var(--ios-text)!important;
    background:
      radial-gradient(circle at 15% -5%,rgba(88,86,214,.20),transparent 35%),
      radial-gradient(circle at 100% 15%,rgba(0,122,255,.12),transparent 32%),
      linear-gradient(180deg,#f7f7fb 0%,#eef0f5 100%)!important;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,sans-serif!important;
  }
  body:before{display:none}
  #app{min-height:calc(100vh - 82px);animation:iosPageIn .32s ease}
  @keyframes iosPageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  #topbar{
    color:var(--ios-text)!important;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif!important;
    font-size:18px!important;font-weight:700!important;
    padding:16px!important;
  }
  #balanceCard{
    margin:0 16px 18px!important;border-radius:24px!important;
    background:linear-gradient(135deg,#5856d6,#007aff)!important;
    box-shadow:0 14px 34px rgba(0,122,255,.22)!important;
    border:1px solid rgba(255,255,255,.28)!important;
  }
  #balanceCard div:nth-child(2){font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif!important}
  #tasksGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px!important}
  .taskTile,.card{
    color:var(--ios-text)!important;
    background:rgba(255,255,255,.72)!important;
    border:1px solid rgba(255,255,255,.8)!important;
    box-shadow:var(--ios-shadow)!important;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-radius:20px!important;
  }
  .taskTile{min-height:112px!important;padding:17px 10px!important}
  .taskTile .icon{
    width:48px!important;height:48px!important;border-radius:15px!important;
    background:linear-gradient(145deg,rgba(88,86,214,.14),rgba(0,122,255,.10))!important;
    border:1px solid rgba(88,86,214,.10)!important;
  }
  .taskTile .icon svg,.navItem svg{
    width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;
  }
  .taskTile>span{display:block;position:relative;z-index:1}
  .btn{
    border-radius:16px!important;min-height:48px!important;
    font-size:15px!important;letter-spacing:-.1px;
    box-shadow:0 8px 20px rgba(0,122,255,.13)!important;
  }
  .btn-primary{
    background:linear-gradient(135deg,#007aff,#5856d6)!important;
  }
  .btn-secondary{
    color:var(--ios-text)!important;background:rgba(255,255,255,.78)!important;
    border:1px solid var(--ios-line)!important;box-shadow:none!important;
  }
  input,select{
    color:var(--ios-text)!important;background:rgba(255,255,255,.82)!important;
    border:1px solid var(--ios-line)!important;
    box-shadow:inset 0 1px 1px rgba(0,0,0,.03)!important;
  }
  input::placeholder{color:#a0a0aa}
  #bottomNav{
    left:12px!important;right:12px!important;bottom:10px!important;
    border:1px solid rgba(60,60,67,.10)!important;border-radius:23px!important;
    background:rgba(250,250,252,.82)!important;
    box-shadow:0 10px 35px rgba(0,0,0,.14)!important;
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  }
  .navItem{
    color:#8b8b93!important;font-size:10px!important;font-weight:600!important;
    border-radius:17px!important;padding:7px 9px!important;
  }
  .navItem.active{color:var(--ios-blue)!important;background:rgba(0,122,255,.09)!important}
  .navItem .icon{font-size:0!important;margin-bottom:2px}
  .navItem .icon svg{display:block;width:21px;height:21px;margin:auto}
  .listRow{border-bottom:1px solid var(--ios-line)!important}
  .status-ok{color:var(--ios-green);font-weight:800;font-size:18px}
  .status-no{color:var(--ios-red);font-weight:800;font-size:18px}
  #adOverlay .box{
    color:var(--ios-text)!important;background:rgba(255,255,255,.90)!important;
    border:1px solid rgba(255,255,255,.9)!important;border-radius:24px!important;
    box-shadow:0 25px 70px rgba(0,0,0,.20)!important;
  }
  @media(prefers-color-scheme:dark){
    :root{--ios-text:#f5f5f7;--ios-muted:#98989f;--ios-line:rgba(255,255,255,.12)}
    body{
      background:
        radial-gradient(circle at 15% -5%,rgba(88,86,214,.25),transparent 35%),
        radial-gradient(circle at 100% 15%,rgba(0,122,255,.16),transparent 32%),
        #000!important;
    }
    .taskTile,.card{background:rgba(28,28,30,.78)!important;border-color:rgba(255,255,255,.08)!important}
    .btn-secondary,input,select{color:#f5f5f7!important;background:rgba(28,28,30,.80)!important}
    #bottomNav{background:rgba(28,28,30,.82)!important;border-color:rgba(255,255,255,.08)!important}
    #topbar{color:#f5f5f7!important}
    #adOverlay .box{color:#f5f5f7!important;background:rgba(28,28,30,.92)!important}
  }
</style>


<style id="premium-v2">
  :root{
    --p-blue:#007aff;--p-purple:#5856d6;--p-cyan:#32ade6;--p-green:#34c759;
    --p-red:#ff3b30;--p-orange:#ff9500;--p-text:#111116;--p-muted:#777782;
  }
  body{position:relative}
  body:after{
    content:"";position:fixed;z-index:-2;inset:-20%;
    background:
      radial-gradient(circle at 15% 20%,rgba(88,86,214,.13),transparent 25%),
      radial-gradient(circle at 85% 30%,rgba(0,122,255,.10),transparent 24%),
      radial-gradient(circle at 45% 100%,rgba(50,173,230,.08),transparent 26%);
    animation:bgDrift 12s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes bgDrift{
    0%{transform:translate3d(-2%,-1%,0) scale(1)}
    50%{transform:translate3d(2%,1%,0) scale(1.04)}
    100%{transform:translate3d(-1%,2%,0) scale(1.02)}
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(18px) scale(.985)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  @keyframes softFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-5px)}
  }
  @keyframes shimmer{
    0%{transform:translateX(-130%)}
    100%{transform:translateX(130%)}
  }
  @keyframes ring{
    0%{box-shadow:0 0 0 0 rgba(0,122,255,.18)}
    70%{box-shadow:0 0 0 10px rgba(0,122,255,0)}
    100%{box-shadow:0 0 0 0 rgba(0,122,255,0)}
  }

  #app>*{animation:cardIn .38s cubic-bezier(.2,.8,.2,1) both}
  #tasksGrid .taskTile{animation:cardIn .42s cubic-bezier(.2,.8,.2,1) both}
  #tasksGrid .taskTile:nth-child(1){animation-delay:.03s}
  #tasksGrid .taskTile:nth-child(2){animation-delay:.07s}
  #tasksGrid .taskTile:nth-child(3){animation-delay:.11s}
  #tasksGrid .taskTile:nth-child(4){animation-delay:.15s}
  #tasksGrid .taskTile:nth-child(5){animation-delay:.19s}
  #tasksGrid .taskTile:nth-child(6){animation-delay:.23s}

  .taskTile{
    cursor:pointer!important;
    transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,border-color .22s!important;
  }
  .taskTile:after{
    content:"";position:absolute;left:-120%;top:0;width:70%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);
    transform:skewX(-18deg);transition:none;pointer-events:none;
  }
  .taskTile:hover:after{animation:shimmer .75s ease}
  .taskTile:active{transform:scale(.955)!important}
  .taskTile .icon{animation:softFloat 3.2s ease-in-out infinite}
  .taskTile:nth-child(even) .icon{animation-delay:.45s}

  #balanceCard{animation:cardIn .5s cubic-bezier(.2,.8,.2,1),ring 3s ease-out 1.1s}
  #balanceCard:after{animation:softFloat 5s ease-in-out infinite}

  .btn{overflow:hidden}
  .btn:before{
    content:"";position:absolute;inset:0;left:-120%;
    width:65%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);
    transform:skewX(-18deg);pointer-events:none;
  }
  .btn:hover:before{animation:shimmer .7s ease}
  .btn:active{transform:scale(.965)!important}

  /* Withdraw page */
  .withdraw-hero{
    margin:0 16px 14px;padding:20px;border-radius:24px;
    color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#007aff 0%,#5856d6 55%,#7a52d8 100%);
    box-shadow:0 16px 38px rgba(0,122,255,.20);
  }
  .withdraw-hero:before,.withdraw-hero:after{
    content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.10);
  }
  .withdraw-hero:before{width:150px;height:150px;right:-55px;top:-70px}
  .withdraw-hero:after{width:90px;height:90px;right:65px;bottom:-55px}
  .withdraw-hero>*{position:relative;z-index:1}
  .withdraw-title{font-size:13px;opacity:.85;font-weight:600}
  .withdraw-balance{font-size:30px;font-weight:800;letter-spacing:-.7px;margin-top:4px}
  .withdraw-sub{font-size:11px;opacity:.78;margin-top:5px}

  .require-box{
    margin:0 16px 14px;padding:16px;border-radius:22px;
    background:rgba(255,255,255,.72);border:1px solid rgba(60,60,67,.10);
    box-shadow:0 10px 30px rgba(0,0,0,.07);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  }
  .require-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
  .require-head strong{font-size:15px}
  .require-head span{font-size:11px;color:var(--p-muted)}
  .req-item{
    display:flex;align-items:center;gap:11px;padding:11px 10px;margin:7px 0;
    border-radius:15px;background:rgba(120,120,128,.07);
    transition:.2s;
  }
  .req-item.done{background:rgba(52,199,89,.10)}
  .req-icon{
    width:34px;height:34px;display:grid;place-items:center;flex:none;
    border-radius:11px;background:rgba(0,122,255,.10);color:var(--p-blue);
  }
  .req-item.done .req-icon{background:rgba(52,199,89,.13);color:var(--p-green)}
  .req-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .req-copy{min-width:0;flex:1}
  .req-copy b{display:block;font-size:12px;font-weight:650}
  .req-copy small{display:block;color:var(--p-muted);font-size:10px;margin-top:2px}
  .req-status{font-size:18px;font-weight:800}
  .req-status.done{color:var(--p-green)}
  .req-status.todo{color:#b0b0b8}
  .progress-track{
    height:7px;border-radius:99px;background:rgba(120,120,128,.13);
    overflow:hidden;margin-top:12px;
  }
  .progress-fill{
    height:100%;border-radius:99px;
    background:linear-gradient(90deg,#007aff,#5856d6,#af52de);
    transition:width .6s cubic-bezier(.2,.8,.2,1);
  }
  .withdraw-form{
    margin:0 16px;padding:16px;border-radius:22px;
    background:rgba(255,255,255,.72);border:1px solid rgba(60,60,67,.10);
    box-shadow:0 10px 30px rgba(0,0,0,.07);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  }
  .form-title{font-size:15px;font-weight:700;margin-bottom:12px}
  .field-label{font-size:10px;color:var(--p-muted);font-weight:600;margin:10px 2px 6px}
  .withdraw-form input,.withdraw-form select{min-height:47px}
  .withdraw-lock{
    display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;padding:11px;
    border-radius:14px;background:rgba(255,149,0,.09);color:#8b6100;font-size:11px;line-height:1.45
  }
  .withdraw-lock svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8}
  .success-pill{
    display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;
    background:rgba(52,199,89,.11);color:var(--p-green);font-size:10px;font-weight:700
  }
  .success-pill svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2}

  @media(prefers-color-scheme:dark){
    .require-box,.withdraw-form{
      background:rgba(28,28,30,.78);border-color:rgba(255,255,255,.08);
      box-shadow:0 12px 34px rgba(0,0,0,.22)
    }
    .req-item{background:rgba(118,118,128,.13)}
    .req-item.done{background:rgba(52,199,89,.13)}

<!-- Firebase (gstatic, fixed version, for a coherent SDK build) -->
<script type="module">

} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

// ===================== FIREBASE CONFIG =====================

const firebaseConfig = {

const tg = window.Telegram?.WebApp;

const tgUser = tg?.initDataUnsafe?.user || { id: "demo123", first_name: "Guest", username: "guest" };
const uid = String(tgUser.id);
const todayKey = () => new Date().toISOString().slice(0, 10);

// ------------- default settings (overridden by Firestore config/settings) -------------
let CFG = {
  adReward: 0.003, surveyReward: 0.015, mathReward: 0.005, quizReward: 0.004,
  spinRewards: [0.002, 0.004, 0.006, 0.010, 0.003, 0.005],

  deviceCheckEnabled: false,

  cloudFunctionUrl: "",

  referralRequiredChannels: []

let monetagFn = null; // filled in after the SDK loads with the zone ID from admin settings

// Dynamically loads the Monetag SDK using the zone ID set in admin.html.
// Nothing is hardcoded in this file - change the zone ID from the admin
// panel any time and it takes effect on the next app load.
function loadMonetagSDK(zoneId) {
  return new Promise((resolve) => {
    if (!zoneId) return resolve(false);
    const fnName = "show_" + zoneId;
    const s = document.createElement("script");
    s.src = "//libtl.com/sdk.js";
    s.dataset.zone = zoneId;
    s.dataset.sdk = fnName;
    s.onload = () => { monetagFn = fnName; resolve(true); };
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
}

let USER = null;
let PROGRESS = null;

// ------------- lightweight device fingerprint (for the optional withdraw-time multi-account check) -------------
function getDeviceFingerprint() {
  try {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    ctx.textBaseline = "top";
    ctx.font = "14px Arial";
    ctx.fillText("device-fp", 2, 2);
    const raw = [
      navigator.userAgent, navigator.language, screen.width + "x" + screen.height,
      screen.colorDepth, new Date().getTimezoneOffset(), canvas.toDataURL()
    ].join("|");
    let hash = 0;
    for (let i = 0; i < raw.length; i++) { hash = (hash << 5) - hash + raw.charCodeAt(i); hash |= 0; }
    return "fp_" + Math.abs(hash).toString(36);
  } catch (e) {
    return "fp_unknown";
  }
}

async function loadConfig() {
  const snap = await getDoc(doc(db, "config", "settings"));
  if (snap.exists()) CFG = { ...CFG, ...snap.data() };
}

async function loadUser() {
  const ref = doc(db, "users", uid);
  const snap = await getDoc(ref);
  const fingerprint = getDeviceFingerprint();
  if (snap.exists()) {
    USER = snap.data();
    if (!USER.deviceFingerprint) {
      USER.deviceFingerprint = fingerprint;
      await updateDoc(ref, { deviceFingerprint: fingerprint });
    }
  } else {
    const startParam = tg?.initDataUnsafe?.start_param || null;
    USER = {
      telegramId: uid, firstName: tgUser.first_name || "", username: tgUser.username || "",
      balance: 0, referredBy: startParam && startParam !== uid ? startParam : null,
      referralCount: 0, deviceFingerprint: fingerprint, banned: false, createdAt: serverTimestamp()
    };
    await setDoc(ref, USER);
    if (USER.referredBy) {
      const refRef = doc(db, "users", USER.referredBy);
      const refSnap = await getDoc(refRef);
      if (refSnap.exists()) {
        const gateChannels = (CFG.referralRequiredChannels || []).filter(c => c && c.username);
        if (gateChannels.length) {
          // Bonus is held until this new user verifies joining every required channel
          await setDoc(doc(db, "referralPending", uid), {
            referrerUid: USER.referredBy, requiredChannels: gateChannels,
            joinedUsernames: [], completed: false, createdAt: serverTimestamp()
          });
        } else {
          await updateDoc(refRef, {
            balance: increment(CFG.referralBonus),
            referralCount: increment(1)
          });
          await addTx(USER.referredBy, "referral", CFG.referralBonus, "New referral joined");
        }
      }
    }
  }
}

// Checks this user's pending referral-gate doc (if any) and, if it's already
// complete from a previous session, does nothing further.
async function getReferralGate() {
  const snap = await getDoc(doc(db, "referralPending", uid));
  if (!snap.exists() || snap.data().completed) return null;
  return snap.data();
}

async function verifyReferralChannel(username) {
  if (!CFG.cloudFunctionUrl) { alert("Verification is not set up yet - admin needs to add the Cloud Function URL."); return false; }
  const res = await fetch(CFG.cloudFunctionUrl.replace(/\/$/, "") + "/checkMembership", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ channelUsername: username, telegramId: uid })
  });
  const data = await res.json();
  return !!data.joined;
}

// Runs only when the admin turns on "Device check" and only at withdraw time.
// Finds other accounts sharing this exact device and, if any are found, bans
// every account on that device (this one included) instead of paying out.
async function runDeviceCheckOrBan() {
  if (!CFG.deviceCheckEnabled) return { ok: true };
  const fp = USER.deviceFingerprint || getDeviceFingerprint();
  const q = query(collection(db, "users"), where("deviceFingerprint", "==", fp));
  const snap = await getDocs(q);
  if (snap.size <= 1) return { ok: true };
  const ids = snap.docs.map(d => d.id);
  await Promise.all(ids.map(id => updateDoc(doc(db, "users", id), { banned: true, banReason: "multi-account device" })));
  return { ok: false, count: ids.length };
}

async function loadProgress() {
  const ref = doc(db, "progress", uid + "_" + todayKey());
  const snap = await getDoc(ref);
  if (snap.exists()) {
    PROGRESS = snap.data();
  } else {
    PROGRESS = { ads: 0, spins: 0, scratches: 0, surveys: 0, quiz: 0, checkin: false };
    await setDoc(ref, PROGRESS);
  }
}

async function saveProgress(field, valueOrIncrement) {
  PROGRESS[field] = valueOrIncrement;
  const ref = doc(db, "progress", uid + "_" + todayKey());
  await updateDoc(ref, { [field]: valueOrIncrement });
}

async function addBalance(amount) {
  USER.balance = (USER.balance || 0) + amount;
  await updateDoc(doc(db, "users", uid), { balance: increment(amount) });
}

async function addTx(forUid, type, amount, note) {
  await addDoc(collection(db, "transactions"), {
    telegramId: forUid, type, amount, note, createdAt: serverTimestamp()
  });
}

function fmt(n) { return Number(n || 0).toFixed(3); }

// ------------- rewarded ad trigger (Monetag) -------------
function showRewardedAd() {
  return new Promise((resolve) => {
    if (monetagFn && typeof window[monetagFn] === "function") {
      window[monetagFn]().then(() => resolve(true)).catch(() => resolve(false));
    } else {
      // Monetag zone ID not set in admin.html yet - fallback so the flow can still be tested
      alert("Ad network is not set up yet - add your Monetag zone ID in the admin panel.");
      resolve(true);
    }
  });
}

function startAutoAdLoop() {
  setInterval(() => {
    if (monetagFn && typeof window[monetagFn] === "function") {

  }, (CFG.autoAdIntervalSec || 120) * 1000);

// ===================== VIEWS =====================
const app = document.getElementById("app");

      <div class="taskTile" data-view="scratch"><div class="icon svg-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4z"/><path d="M12 8v2M12 14v2"/></svg></div><span>Scratch card</span></div>

// If this user joined via a referral link and the admin requires joining
// specific channels first, show that checklist here until it's done -
// only then does the person who referred them get their bonus.
async function loadReferralGateIntoHome() {

    </div>`;
  }).join("");

  list.querySelectorAll(".gateJoinBtn").forEach(b => b.addEventListener("click", () => {
    tg?.openTelegramLink ? tg.openTelegramLink(b.dataset.link) : window.open(b.dataset.link, "_blank");
  }));

  list.querySelectorAll(".gateVerifyBtn").forEach(b => b.addEventListener("click", async () => {
    b.disabled = true; b.textContent = "Checking...";
    const joined = await verifyReferralChannel(b.dataset.username);
    if (!joined) {
      alert("You haven't joined that channel yet.");
      b.disabled = false; b.textContent = "Verify";
      return;
    }
    const gateRef = doc(db, "referralPending", uid);
    const updated = Array.from(new Set([...gate.joinedUsernames, b.dataset.username]));
    gate.joinedUsernames = updated;
    await updateDoc(gateRef, { joinedUsernames: updated });

    if (updated.length >= gate.requiredChannels.length) {
      await updateDoc(gateRef, { completed: true });
      await updateDoc(doc(db, "users", gate.referrerUid), {
        balance: increment(CFG.referralBonus), referralCount: increment(1)
      });
      await addTx(gate.referrerUid, "referral", CFG.referralBonus, "Referral completed channel requirement");
      alert("All channels verified! Your referrer just got their bonus.");
      slot.innerHTML = "";
    } else {
      loadReferralGateIntoHome();
    }
  }));
}

// Shows a tile for admin-added channel-join tasks right inside the task
// grid, but only when at least one is actually active - nothing hardcoded.
async function loadAdminTasksIntoHome() {
  const slot = document.getElementById("adminTaskSlot");
  if (!slot) return;
  try {
    const snap = await getDocs(query(collection(db, "channelTasks"), where("status", "==", "active")));
    const activeCount = snap.docs.filter(d => (d.data().joinsRemaining ?? 1) > 0).length;
    if (!activeCount) { slot.innerHTML = ""; return; }
    slot.innerHTML = `
      <div style="padding:0 16px 16px;">
        <div class="taskTile" id="channelTaskTile" style="display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;">

          </div>
        </div>
      </div>
    `;
    document.getElementById("channelTaskTile").addEventListener("click", () => navigate("channelTasks"));
  } catch (e) {

}

        </div>
      </div>

      <div class="survey-section">
        <div class="survey-section-title"><div class="dot">↗</div><b>Reveal your card</b><span>Scratch it</span></div>
        <div id="scratchWrap" style="position:relative;border-radius:16px;overflow:hidden;height:140px;background:linear-gradient(135deg,#2b2f45,#171925);">
          <div id="scratchReward" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;">
            <div style="font-size:11px;color:var(--p-muted);">YOU WON</div>
            <div id="scratchAmount" style="font-size:26px;font-weight:800;margin-top:2px;"></div>
          </div>
          <canvas id="scratchCanvas" style="position:absolute;inset:0;width:100%;height:100%;${usedUp ? "cursor:default;" : "cursor:pointer;touch-action:none;"}"></canvas>
        </div>
        <div id="scratchResult"></div>
        <div class="survey-limit">${usedUp ? "You have reached today's scratch card limit." : `${CFG.dailyScratchLimit - PROGRESS.scratches} card${CFG.dailyScratchLimit - PROGRESS.scratches === 1 ? "" : "s"} remaining today.`}</div>
      </div>
    </div>
  `;
  document.getElementById("scBack").addEventListener("click", () => navigate("home"));

  const reward = CFG.scratchRewards[Math.floor(Math.random() * CFG.scratchRewards.length)];
  document.getElementById("scratchAmount").textContent = fmt(reward) + " USDT";

  if (usedUp) return;

  const canvas = document.getElementById("scratchCanvas");
  const wrap = document.getElementById("scratchWrap");
  const ctx = canvas.getContext("2d");
  let revealed = false;

  function setupCanvas() {
    const rect = wrap.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    ctx.fillStyle = "#9aa0ad";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.font = "600 13px -apple-system, Arial";
    ctx.textAlign = "center";
    ctx.fillText("SCRATCH HERE", canvas.width / 2, canvas.height / 2 + 5);
    ctx.globalCompositeOperation = "destination-out";
  }
  setupCanvas();

  function scratchAt(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 22, 0, Math.PI * 2);
    ctx.fill();
  }

  function pointFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  function checkRevealPercent() {
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let cleared = 0;
    for (let i = 3; i < data.length; i += 4 * 20) { if (data[i] === 0) cleared++; }
    return cleared / (data.length / (4 * 20));
  }

  function onReveal() {
    if (revealed) return;
    revealed = true;
    canvas.style.transition = "opacity .3s";
    canvas.style.opacity = "0";
    setTimeout(() => { canvas.style.display = "none"; }, 300);
    document.getElementById("scratchResult").innerHTML =
      `<button class="survey-submit" id="claimScratchBtn" style="margin-top:12px;"><span>Watch ad to claim</span></button>`;
    document.getElementById("claimScratchBtn").addEventListener("click", async () => {
      const ok = await showRewardedAd();
      if (ok) {
        await addBalance(reward);
        await saveProgress("scratches", PROGRESS.scratches + 1);
        await addTx(uid, "scratch", reward, "Scratch card reward");
        renderScratch();
      }
    });
  }

  let dragging = false;
  const start = e => { dragging = true; const p = pointFromEvent(e); scratchAt(p.x, p.y); };
  const move = e => {
    if (!dragging || revealed) return;
    e.preventDefault();
    const p = pointFromEvent(e);
    scratchAt(p.x, p.y);
    if (checkRevealPercent() > 0.45) onReveal();
  };
  const end = () => { dragging = false; };

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, { passive: true });
  canvas.addEventListener("touchmove", move, { passive: false });
  canvas.addEventListener("touchend", end);
}

async function fetchTriviaQuestion() {
  try {
    const res = await fetch("https://opentdb.com/api.php?amount=1&difficulty=hard&type=multiple");
    const data = await res.json();
    const q = data.results[0];
    const decode = (s) => { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; };
    const options = [...q.incorrect_answers.map(decode), decode(q.correct_answer)].sort(() => Math.random() - 0.5);
    return { question: decode(q.question), correct: decode(q.correct_answer), options };
  } catch (e) {
    return { question: "What is the capital of Bangladesh?", correct: "Dhaka", options: ["Chittagong", "Dhaka", "Khulna", "Sylhet"] };
  }
}

async function loadChannelTaskList() {
  const q = query(collection(db, "channelTasks"), where("status", "==", "active"));
  const snap = await getDocs(q);
  const list = document.getElementById("ctList");
  const tasks = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(t => (t.joinsRemaining ?? 1) > 0);
  if (!tasks.length) {
    list.innerHTML = `<div class="survey-note"><span>No channels to join right now. Check back later.</span></div>`;
    return;
  }
  // Check which ones this user already claimed
  const claimSnap = await getDocs(query(collection(db, "channelJoinClaims"), where("telegramId", "==", uid)));
  const claimedIds = new Set(claimSnap.docs.map(d => d.data().taskId));

  list.innerHTML = tasks.map(t => {
    const already = claimedIds.has(t.id);
    return `
      <div class="survey-rule" style="align-items:center;">
        <span class="survey-rule-num">

        <button class="btn btn-secondary ctJoinBtn" data-link="${t.channelLink}" style="flex:1;">Open channel</button>
        <button class="btn btn-primary ctVerifyBtn" data-id="${t.id}" data-username="${t.channelUsername}" data-reward="${t.rewardPerJoin}" style="flex:1;" ${already ? "disabled" : ""}>
          ${already ? "Already claimed" : "Verify & claim"}
        </button>
      </div>
    `;
  }).join("");

  document.querySelectorAll(".ctJoinBtn").forEach(b => b.addEventListener("click", () => {
    const link = b.dataset.link;
    tg?.openTelegramLink ? tg.openTelegramLink(link) : window.open(link, "_blank");
  }));

  document.querySelectorAll(".ctVerifyBtn").forEach(b => b.addEventListener("click", async () => {
    if (!CFG.cloudFunctionUrl) return alert("Verification is not set up yet - admin needs to add the Cloud Function URL.");
    b.disabled = true;
    b.textContent = "Checking...";
    try {
      const res = await fetch(CFG.cloudFunctionUrl.replace(/\/$/, "") + "/checkMembership", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ channelUsername: b.dataset.username, telegramId: uid })
      });
      const data = await res.json();
      if (!data.joined) {
        alert("You haven't joined that channel yet.");
        b.disabled = false; b.textContent = "Verify & claim";
        return;
      }
      const reward = Number(b.dataset.reward);
      const id = b.dataset.id;
      await addDoc(collection(db, "channelJoinClaims"), { taskId: id, telegramId: uid, claimedAt: serverTimestamp() });
      await updateDoc(doc(db, "channelTasks", id), { joinsRemaining: increment(-1) });
      await addBalance(reward);
      await addTx(uid, "channel_join", reward, "Joined channel task");
      b.textContent = "Claimed";
      alert("Verified! " + fmt(reward) + " USDT added to your balance.");
    } catch (e) {
      console.error(e);
      alert("Could not verify right now. Try again later.");
      b.disabled = false; b.textContent = "Verify & claim";
    }
  }));
}

  document.getElementById("atBack").addEventListener("click", () => navigate("profile"));

  const updateCost = () => {
    const reward = parseFloat(document.getElementById("atReward").value) || 0;
    const joins = parseInt(document.getElementById("atJoins").value) || 0;
    document.getElementById("atCost").innerHTML = `<span>Total cost: <b>${fmt(reward * joins)} USDT</b> for ${joins || 0} joins</span>`;
  };
  document.getElementById("atReward").addEventListener("input", updateCost);
  document.getElementById("atJoins").addEventListener("input", updateCost);

  document.getElementById("atSubmit").addEventListener("click", async () => {
    const link = document.getElementById("atLink").value.trim();
    const username = document.getElementById("atUsername").value.trim().replace(/^@/, "");
    const reward = parseFloat(document.getElementById("atReward").value);
    const joins = parseInt(document.getElementById("atJoins").value);
    const method = document.getElementById("atMethod").value;

    if (!link || !username) return alert("Enter the channel link and username.");
    if (!reward || reward < CFG.minChannelTaskReward) return alert(`Reward must be at least ${fmt(CFG.minChannelTaskReward)} USDT.`);
    if (!joins || joins < 1) return alert("Enter how many joins to fund.");
    const total = reward * joins;

    if (method === "balance") {
      if (total > USER.balance) return alert("Your balance isn't enough for this budget.");
      await addDoc(collection(db, "channelTasks"), {
        title: username, channelLink: link, channelUsername: username,
        rewardPerJoin: reward, joinsRemaining: joins, ownerUid: uid,
        paymentType: "balance", status: "active", createdAt: serverTimestamp()
      });
      await addBalance(-total);
      await addTx(uid, "add_task", -total, "Funded channel task: " + username);
      alert("Your channel is live now.");
    } else {
      await addDoc(collection(db, "channelTasks"), {
        title: username, channelLink: link, channelUsername: username,
        rewardPerJoin: reward, joinsRemaining: joins, ownerUid: uid,
        paymentType: "external", status: "pending_payment", createdAt: serverTimestamp()
      });
      alert("Submitted. Send the payment as instructed by admin - your channel goes live after approval.");
    }
    navigate("profile");
  });
}

async function renderWithdraw() {
  const req = CFG.withdrawRequiredTasks;
  const checks = [
    { key:"ads", label:`Watch ${req.ads} ads`, sub:"Complete today's ad requirement", done:PROGRESS.ads >= req.ads, icon:`<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>` },
    { key:"checkin", label:"Daily check-in", sub:"Complete your daily check-in", done:!req.checkin || PROGRESS.checkin, icon:`<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>` },
    { key:"surveys", label:`Complete ${req.surveys} survey`, sub:"Submit the required survey", done:PROGRESS.surveys >= req.surveys, icon:`<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>` },
    { key:"quiz", label:`Answer ${req.quiz} quiz questions`, sub:"Answer the required questions", done:PROGRESS.quiz >= req.quiz, icon:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4.2 1.8c-1.2 1-1.7 1.4-1.7 2.7M12 17h.01"/></svg>` }
  ];
  const completed = checks.filter(c => c.done).length;
  const progress = Math.round((completed / checks.length) * 100);
  const allDone = completed === checks.length;

  app.innerHTML = `
    <div class="survey-page">
      <div class="survey-top">
        <button class="survey-back" id="wBack" aria-label="Back">‹</button>
        <div class="survey-heading">
          <h1>Withdraw</h1>
          <p>Cash out your USDT balance</p>
        </div>
      </div>

    <div class="withdraw-hero">
      <div class="withdraw-title">Available balance</div>
      <div class="withdraw-balance">${fmt(USER.balance)} <span style="font-size:13px;font-weight:700;opacity:.82">USDT</span></div>
      <div class="withdraw-sub">${allDone ? "You're ready to request a withdrawal." : "Complete the requirements below to unlock withdrawal."}</div>
    </div>

    <div class="require-box">
      <div class="require-head">
        <div>
          <strong>Withdrawal requirements</strong>
          <div style="font-size:10px;color:var(--p-muted);margin-top:3px">${completed} of ${checks.length} completed</div>
        </div>
        ${allDone
          ? `<span class="success-pill"><svg viewBox="0 0 24 24"><path d="m6 12 4 4 8-9"/></svg>Ready</span>`
          : `<span style="font-size:12px;font-weight:700;color:var(--p-blue)">${progress}%</span>`}
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>

      ${checks.map(c => `
        <div class="req-item ${c.done ? "done" : ""}">
          <div class="req-icon">${c.icon}</div>
          <div class="req-copy"><b>${c.label}</b><small>${c.sub}</small></div>
          <div class="req-status ${c.done ? "done" : "todo"}">${c.done ? "✓" : "○"}</div>
        </div>
      `).join("")}
    </div>

    <div class="withdraw-form">
      <div class="form-title">Withdrawal details</div>

      <div class="field-label">AMOUNT</div>
      <input id="wAmount" placeholder="Enter USDT amount" inputmode="decimal" ${allDone ? "" : "disabled"} />

      <div class="field-label">PAYMENT METHOD</div>
      <select id="wMethod" ${allDone ? "" : "disabled"}>
        <option value="Binance">Binance (USDT)</option>
        <option value="Bkash">Bkash</option>
        <option value="Nagad">Nagad</option>
      </select>

      <div class="field-label">ACCOUNT / WALLET</div>
      <input id="wAccount" placeholder="Enter Binance UID / wallet / number" ${allDone ? "" : "disabled"} />

      ${!allDone ? `
        <div class="withdraw-lock">
          <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <span>Complete all requirements above before submitting a withdrawal request.</span>
        </div>
      ` : `
        <div style="margin-top:12px;font-size:10px;color:var(--p-muted);line-height:1.45">
          Minimum withdrawal: <b style="color:var(--p-text)">${fmt(CFG.minWithdraw)} USDT</b>
        </div>
      `}

      <button class="btn btn-primary" id="wSubmit" style="margin-top:14px" ${allDone ? "" : "disabled"}>
        ${allDone ? "Request withdrawal" : "Complete requirements first"}
      </button>
    </div>
    </div>
  `;

  document.getElementById("wBack").addEventListener("click", () => navigate("home"));

  document.getElementById("wSubmit")?.addEventListener("click", async () => {
    const amount = parseFloat(document.getElementById("wAmount").value);
    const method = document.getElementById("wMethod").value;
    const account = document.getElementById("wAccount").value.trim();
    if (!amount || amount < CFG.minWithdraw || amount > USER.balance) return alert("Invalid amount.");
    if (!account) return alert("Enter your account / wallet address.");

    const btn = document.getElementById("wSubmit");
    btn.disabled = true;
    btn.textContent = "Checking device...";
    const deviceResult = await runDeviceCheckOrBan();
    if (!deviceResult.ok) {
      renderBanned();
      return;
    }

    await addDoc(collection(db, "withdrawals"), {
      telegramId: uid, amount, method, account, status: "pending", requestedAt: serverTimestamp()
    });
    await addBalance(-amount);
    alert("Withdraw request submitted.");
    renderWithdraw();
  });
}

  }).join("");
}

function navigate(view) {
  document.querySelectorAll(".navItem").forEach(n => n.classList.toggle("active", n.dataset.view === view));
  if (["home","survey","spin","scratch","checkin","math","quiz"].includes(view) && ["refer","withdraw","history"].some(v => document.querySelector(`.navItem[data-view=${v}]`)?.classList.contains("active"))) {
    document.querySelectorAll(".navItem").forEach(n => n.classList.toggle("active", n.dataset.view === "home"));
  }
  if (view === "home") renderHome();
  else if (view === "survey") renderSurvey();
  else if (view === "spin") renderSpin();
  else if (view === "scratch") renderScratch();
  else if (view === "checkin") renderCheckin();
  else if (view === "math") renderMath();
  else if (view === "quiz") renderQuiz();
  else if (view === "refer") renderRefer();
  else if (view === "withdraw") renderWithdraw();
  else if (view === "history") renderHistory();
  else if (view === "channelTasks") renderChannelTasks();
  else if (view === "addTask") renderAddTask();
  else if (view === "profile") renderProfile();
}

document.querySelectorAll("#bottomNav .navItem").forEach(el =>
  el.addEventListener("click", () => navigate(el.dataset.view))
);

function renderBanned() {
  document.getElementById("bottomNav").classList.add("hidden");
  app.innerHTML = `

  `;
}
