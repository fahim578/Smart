  collection, query, where, orderBy, limit, getDocs, serverTimestamp

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

const todayKey = () => new Date().toISOString().slice(0, 10);

// ------------- default settings (overridden by Firestore config/settings) -------------
let CFG = {
  adReward: 0.003, surveyReward: 0.015, mathReward: 0.005, quizReward: 0.004,
  spinRewards: [0.002, 0.004, 0.006, 0.010, 0.003, 0.005],
  scratchRewards: [0.005, 0.010, 0.015],
  checkinRewards: [0.002, 0.003, 0.004, 0.006, 0.008, 0.010, 0.015],
  dailyAdLimit: 20, dailySpinLimit: 3, dailyScratchLimit: 2,
  dailySurveyLimit: 2, dailyQuizLimit: 10,
  referralBonus: 0.020, minWithdraw: 1.000,
  autoAdIntervalSec: 120,
  surveyLink: "https://your-adsterra-or-gigapub-direct-link.com",
  monetagZoneId: "",
  withdrawRequiredTasks: { ads: 5, checkin: true, surveys: 1, quiz: 3 }
};

let monetagFn = null; // filled in after the SDK loads with the zone ID from admin settings

// Dynamically loads the Monetag SDK using the zone ID set in admin.html.
// Nothing is hardcoded in this file - change the zone ID from the admin
// panel any time and it takes effect on the next app load.
function loadMonetagSDK(zoneId) {
  return new Promise((resolve) => {
    if (!zoneId) return resolve(false);
    const fnName = "show_" + zoneId;
    const s = document.createElement("script");
    s.src = "//libtl.com/sdk.js";
    s.dataset.zone = zoneId;
    s.dataset.sdk = fnName;
    s.onload = () => { monetagFn = fnName; resolve(true); };
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
}

let USER = null;
let PROGRESS = null;

async function loadConfig() {
  const snap = await getDoc(doc(db, "config", "settings"));
  if (snap.exists()) CFG = { ...CFG, ...snap.data() };
}

async function loadUser() {
  const ref = doc(db, "users", uid);
  const snap = await getDoc(ref);
  if (snap.exists()) {
    USER = snap.data();
  } else {
    const startParam = tg?.initDataUnsafe?.start_param || null;
    USER = {
      telegramId: uid, firstName: tgUser.first_name || "", username: tgUser.username || "",
      balance: 0, referredBy: startParam && startParam !== uid ? startParam : null,
      referralCount: 0, createdAt: serverTimestamp()
    };
    await setDoc(ref, USER);
    if (USER.referredBy) {
      const refRef = doc(db, "users", USER.referredBy);
      const refSnap = await getDoc(refRef);
      if (refSnap.exists()) {
        await updateDoc(refRef, {
          balance: increment(CFG.referralBonus),
          referralCount: increment(1)
        });
        await addTx(USER.referredBy, "referral", CFG.referralBonus, "New referral joined");
      }
    }
  }
}

async function loadProgress() {
  const ref = doc(db, "progress", uid + "_" + todayKey());
  const snap = await getDoc(ref);
  if (snap.exists()) {
    PROGRESS = snap.data();
  } else {
    PROGRESS = { ads: 0, spins: 0, scratches: 0, surveys: 0, quiz: 0, checkin: false };
    await setDoc(ref, PROGRESS);
  }
}

async function saveProgress(field, valueOrIncrement) {
  PROGRESS[field] = valueOrIncrement;
  const ref = doc(db, "progress", uid + "_" + todayKey());
  await updateDoc(ref, { [field]: valueOrIncrement });
}

async function addBalance(amount) {
  USER.balance = (USER.balance || 0) + amount;
  await updateDoc(doc(db, "users", uid), { balance: increment(amount) });
}

async function addTx(forUid, type, amount, note) {
  await addDoc(collection(db, "transactions"), {
    telegramId: forUid, type, amount, note, createdAt: serverTimestamp()
  });
}

function fmt(n) { return Number(n || 0).toFixed(3); }

// ------------- rewarded ad trigger (Monetag) -------------
function showRewardedAd() {
  return new Promise((resolve) => {
    if (monetagFn && typeof window[monetagFn] === "function") {
      window[monetagFn]().then(() => resolve(true)).catch(() => resolve(false));
    } else {
      // Monetag zone ID not set in admin.html yet - fallback so the flow can still be tested
      alert("Ad network is not set up yet - add your Monetag zone ID in the admin panel.");
      resolve(true);
    }
  });
}

// ------------- auto interstitial popup (no reward) -------------
function startAutoAdLoop() {
  setInterval(() => {
    if (monetagFn && typeof window[monetagFn] === "function") {
      window[monetagFn]("pop");
    }
  }, (CFG.autoAdIntervalSec || 120) * 1000);
}

function renderMath() {
  const a = Math.floor(Math.random() * 40) + 5;
  const b = Math.floor(Math.random() * 40) + 5;
  const correct = a + b;
  let opts = [correct, correct + 2, correct - 3, correct + 5].sort(() => Math.random() - 0.5);
  app.innerHTML = `
    <div id="topbar"><span>← Math challenge</span></div>
    <div style="padding:16px;">
      <div class="card" style="text-align:center;font-size:22px;font-weight:600;">${a} + ${b} = ?</div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px;" id="mathOpts">
        ${opts.map(o => `<button class="btn btn-secondary opt">${o}</button>`).join("")}
      </div>
      <div id="mathResult"></div>
    </div>
  `;
  document.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", async function () {
    const val = Number(this.textContent);
    document.querySelectorAll(".opt").forEach(b => b.disabled = true);
    if (val === correct) {
      document.getElementById("mathResult").innerHTML =
        `<button class="btn btn-primary" id="claimMathBtn" style="margin-top:12px;">Watch ad to claim ${fmt(CFG.mathReward)} USDT</button>`;
      document.getElementById("claimMathBtn").addEventListener("click", async () => {
        const ok = await showRewardedAd();
        if (ok) {
          await addBalance(CFG.mathReward);
          await addTx(uid, "math", CFG.mathReward, "Math challenge correct");

      });
    } else {
      document.getElementById("mathResult").innerHTML =
        `<p style="margin-top:12px;font-size:13px;color:#999;">Wrong answer - no reward this time.</p>
         <button class="btn btn-secondary" id="nextMathBtn" style="margin-top:8px;">Try another</button>`;
      document.getElementById("nextMathBtn").addEventListener("click", renderMath);
    }
  }));
}

async function fetchTriviaQuestion() {
  try {
    const res = await fetch("https://opentdb.com/api.php?amount=1&difficulty=hard&type=multiple");
    const data = await res.json();
    const q = data.results[0];
    const decode = (s) => { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; };
    const options = [...q.incorrect_answers.map(decode), decode(q.correct_answer)].sort(() => Math.random() - 0.5);
    return { question: decode(q.question), correct: decode(q.correct_answer), options };
  } catch (e) {
    return { question: "What is the capital of Bangladesh?", correct: "Dhaka", options: ["Chittagong", "Dhaka", "Khulna", "Sylhet"] };
  }
}

    <div id="balanceCard"><div style="font-size:12px;opacity:0.85;">Available balance</div>
      <div style="font-size:22px;font-weight:600;">${fmt(USER.balance)} USDT</div></div>
    <p style="padding:0 16px 8px;font-size:12px;color:#999;">Complete today's tasks to unlock withdraw</p>
    <div style="padding:0 16px 12px;">
      ${checks.map(c => `<div class="listRow"><span style="color:${c.done?'#fff':'#777'}">${c.label}</span><span>${c.done ? "✅" : "❌"}</span></div>`).join("")}
    </div>
    ${!allDone ? `<div class="card" style="margin:0 16px 14px;color:#e0a72c;font-size:12px;">Finish all tasks above to unlock withdraw.</div>` : ""}
    <div style="padding:0 16px 10px;">
      <input id="wAmount" placeholder="Amount (USDT)" ${allDone ? "" : "disabled"} />
    </div>
    <div style="padding:0 16px 10px;">
      <select id="wMethod" ${allDone ? "" : "disabled"} style="width:100%;padding:11px;border-radius:10px;background:#1a1a22;color:#fff;border:1px solid #2c2c38;">
        <option value="Binance">Binance (USDT)</option>
        <option value="Bkash">Bkash</option>
        <option value="Nagad">Nagad</option>
      </select>
    </div>
    <div style="padding:0 16px 10px;">
      <input id="wAccount" placeholder="Binance UID / wallet address" ${allDone ? "" : "disabled"} />
    </div>
    <div style="padding:0 16px 16px;">
      <button class="btn btn-primary" id="wSubmit" ${allDone ? "" : "disabled"}>Request withdraw</button>
    </div>
  `;
  document.getElementById("wSubmit")?.addEventListener("click", async () => {
    const amount = parseFloat(document.getElementById("wAmount").value);
    const method = document.getElementById("wMethod").value;
    const account = document.getElementById("wAccount").value.trim();
    if (!amount || amount < CFG.minWithdraw || amount > USER.balance) return alert("Invalid amount.");
    if (!account) return alert("Enter your account / wallet address.");
    await addDoc(collection(db, "withdrawals"), {
      telegramId: uid, amount, method, account, status: "pending", requestedAt: serverTimestamp()
    });
    await addBalance(-amount);
    alert("Withdraw request submitted.");
    renderWithdraw();
  });
}

async function renderHistory() {
  app.innerHTML = `<div id="topbar"><span>← History</span></div><div id="histList" style="padding:0 16px;">Loading...</div>`;
  const q = query(collection(db, "transactions"), where("telegramId", "==", uid), orderBy("createdAt", "desc"), limit(30));
  const snap = await getDocs(q);
  if (snap.empty) {
    document.getElementById("histList").innerHTML = `<p style="color:#999;font-size:13px;">No activity yet.</p>`;
    return;
  }
  document.getElementById("histList").innerHTML = snap.docs.map(d => {
    const t = d.data();
    return `<div class="listRow"><span>${t.note || t.type}</span><span style="color:${t.amount>=0?'#5dcaa5':'#e24b4a'}">${t.amount>=0?'+':''}${fmt(t.amount)}</span></div>`;
  }).join("");
}

function navigate(view) {
  document.querySelectorAll(".navItem").forEach(n => n.classList.toggle("active", n.dataset.view === view));
  if (["home","survey","spin","scratch","checkin","math","quiz"].includes(view) && ["refer","withdraw","history"].some(v => document.querySelector(`.navItem[data-view=${v}]`)?.classList.contains("active"))) {
    document.querySelectorAll(".navItem").forEach(n => n.classList.toggle("active", n.dataset.view === "home"));
  }
  if (view === "home") renderHome();
  else if (view === "survey") renderSurvey();
  else if (view === "spin") renderSpin();
  else if (view === "scratch") renderScratch();
  else if (view === "checkin") renderCheckin();
  else if (view === "math") renderMath();
  else if (view === "quiz") renderQuiz();
  else if (view === "refer") renderRefer();
  else if (view === "withdraw") renderWithdraw();
  else if (view === "history") renderHistory();
}

document.querySelectorAll("#bottomNav .navItem").forEach(el =>
  el.addEventListener("click", () => navigate(el.dataset.view))
);

(async function init() {
  await loadConfig();
  await loadMonetagSDK(CFG.monetagZoneId);
  await loadUser();
  await loadProgress();
  navigate("home");
  startAutoAdLoop();
})();
</script>
</body>
</html>
